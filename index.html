<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script src="/theme-init.js"></script>
		<title>PTV GTFS Realtime Dashboard</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
		<link rel="stylesheet" href="style.css" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
		<script src="https://unpkg.com/lucide@1.16.0/dist/umd/lucide.js" integrity="sha384-T8akqsreXpbv2/2EEJuq+N2Qiy1xZOom6kCvqIeITxBHl6XQ07MMg1wsDCc9tzVp" crossorigin="anonymous" defer></script>
		<script type="module" src="script.js"></script>
	</head>
	<body>
		<div class="layout">
			<aside class="sidebar">
				<button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
					<i data-lucide="menu" class="icon"></i>
				</button>
				<div class="logo" aria-label="PTV">PTV</div>
				<nav class="nav" aria-label="Primary" role="tablist" aria-orientation="vertical">
					<button
						class="nav-btn active"
						type="button"
						data-panel="panel-dashboard"
						role="tab"
						aria-selected="true"
						tabindex="0"
					>
						<i data-lucide="layout-dashboard" class="icon"></i>
						<span>Dashboard</span>
					</button>
					<button class="nav-btn" type="button" data-panel="panel-preview" role="tab" aria-selected="false" tabindex="-1">
						<i data-lucide="file-text" class="icon"></i>
						<span>Preview</span>
					</button>
				</nav>
				<div class="sidebar-footer">
					<button id="theme-toggle" class="btn btn-outline btn-sm" type="button">
						<i data-lucide="moon" class="icon"></i>
						<span>Dark mode</span>
					</button>
				</div>
			</aside>

			<main class="main">
				<div class="main-map">
					<span id="map-hint" class="note">Vehicle positions only</span>
					<div id="map" class="map" role="img" aria-label="Vehicle positions map"></div>
					<div id="map-empty" class="map-empty" role="status" aria-live="polite"></div>
				</div>
				<div class="main-content">
					<header class="page-header">
						<div>
							<p class="subtitle">PTV GTFS Realtime</p>
							<h1 class="page-title">Live transit pulse</h1>
						</div>
						<button id="load" class="btn btn-primary" type="button">
							<i data-lucide="refresh-cw" class="icon"></i>
							<span>Fetch latest</span>
						</button>
					</header>

					<section id="panel-dashboard" class="panel active">
						<div class="card">
							<div class="card-header">
								<h2 class="card-title">Feed controls</h2>
								<span class="note">Choose a feed and refresh</span>
							</div>
							<div class="control-grid">
								<div class="field">
									<label for="feed">Feed</label>
									<select id="feed">
										<option value="metro-vehicle-positions">Metro train vehicle positions</option>
										<option value="metro-trip-updates">Metro train trip updates</option>
										<option value="metro-service-alerts">Metro train service alerts</option>
										<option value="bus-vehicle-positions">Bus vehicle positions</option>
										<option value="bus-trip-updates">Bus trip updates</option>
										<option value="bus-service-alerts">Bus service alerts</option>
									</select>
								</div>
								<div class="field">
									<label for="route-search">Route search</label>
									<input id="route-search" type="text" inputmode="numeric" placeholder="e.g. 765 or 733" autocomplete="off" />
								</div>
								<label class="checkbox-row">
									<input id="mock" class="checkbox" type="checkbox" />
									<span>Use mock data (offline)</span>
								</label>
								<label class="checkbox-row">
									<input id="auto-refresh" class="checkbox" type="checkbox" />
									<span>Auto-refresh every 30s</span>
								</label>
							</div>
							<div class="status-row">
								<span class="label">Status</span>
								<span id="status" class="status" data-state="idle">Idle</span>
								<span id="error" class="error" role="alert"></span>
								<span id="countdown" class="countdown"></span>
							</div>
						</div>

						<div class="card-grid">
							<div class="card stat-card">
								<div class="icon-box accent-yellow">
									<i data-lucide="clock" class="icon icon-lg"></i>
								</div>
								<div>
									<span class="label">Feed timestamp</span>
									<div id="updated" class="stat-value">-</div>
								</div>
							</div>
							<div class="card stat-card">
								<div class="icon-box accent-blue">
									<i data-lucide="layers" class="icon icon-lg"></i>
								</div>
								<div>
									<span id="stat-label" class="label">Entities in preview</span>
									<div id="count" class="stat-value">-</div>
								</div>
							</div>
						</div>
					</section>

					<section id="panel-preview" class="panel">
						<div class="card">
							<div class="card-header">
								<h2 class="card-title">Preview payload</h2>
								<span class="note">First 5 entities</span>
							</div>
							<pre id="preview-json" class="preview-json">Waiting for data...</pre>
							<div id="preview-list" class="preview-list"></div>
						</div>
					</section>
				</div>
			</main>
		</div>
		<div id="toast-container" class="toast-container" aria-live="polite"></div>
	</body>
</html>
